version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      # Daily, to match the daily scheduled audit: a weekly cadence left new
      # advisories failing the audit for days before a fix PR appeared.
      interval: daily
    # Gemfile.lock is committed, so also track transitive gems (rack, nokogiri,
    # etc.); otherwise advisories in them only surface when the scheduled
    # bundler-audit run fails.
    allow:
      - dependency-type: all
    # One PR per run for all minor/patch bumps (auto-merged once CI passes); majors stay separate PRs.
    groups:
      bundler-minor-patch:
        patterns:
        - "*"
        update-types:
        - minor
        - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
